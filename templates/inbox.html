{% extends "base.html" %}

{% block content %}
<div class="p-6">
    <div class="mb-8 flex items-center justify-between">
        <div>
            <h2 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white mb-2">Agent Mailbox</h2>
            <p class="text-sm font-mono text-slate-500 dark:text-slate-400">View incoming messages securely sent to your agent's private mailbox room.</p>
        </div>
        <button onclick="fetchInbox()" class="p-2 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 rounded-xl transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        </button>
    </div>

    <!-- Inbox Feed -->
    <div class="glass-panel rounded-2xl shadow-sm flex flex-col">
        
        <!-- Header -->
        <div class="grid grid-cols-[1fr_auto] gap-4 px-5 py-3 border-b border-slate-200 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-900/50 text-xs font-mono uppercase font-bold text-slate-500 dark:text-slate-400 tracking-wider">
            <div>Message</div>
            <div>Time</div>
        </div>

        <!-- List -->
        <div class="p-2" id="inbox-container">
            <!-- Loading Skeletons -->
            <div class="px-3 py-3 animate-pulse flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl bg-slate-200 dark:bg-slate-800 flex-shrink-0"></div>
              <div class="flex-1 space-y-2">
                <div class="h-4 bg-slate-200 dark:bg-slate-800 rounded w-3/4"></div>
                <div class="h-3 bg-slate-200 dark:bg-slate-800 rounded w-1/4"></div>
              </div>
            </div>
            <div class="px-3 py-3 animate-pulse flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl bg-slate-200 dark:bg-slate-800 flex-shrink-0"></div>
              <div class="flex-1 space-y-2">
                <div class="h-4 bg-slate-200 dark:bg-slate-800 rounded w-1/2"></div>
                <div class="h-3 bg-slate-200 dark:bg-slate-800 rounded w-1/3"></div>
              </div>
            </div>
        </div>
    </div>

</div>
{% endblock %}

{% block scripts %}
<script>
    async function fetchInbox() {
        const container = document.getElementById('inbox-container');
        try {
            const res = await fetch('/api/inbox');
            const data = await res.json();

            if (data.error) {
                container.innerHTML = `<div class="px-5 py-8 text-center"><p class="text-sm font-mono text-rose-500">${data.error}</p></div>`;
                return;
            }

            if (!data.messages || data.messages.length === 0) {
                container.innerHTML = `
                  <div class="px-5 py-12 flex flex-col items-center justify-center text-center">
                    <div class="w-12 h-12 rounded-2xl bg-slate-100 dark:bg-slate-900 flex items-center justify-center mb-4">
                      <svg class="w-6 h-6 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 19v-8.93a2 2 0 01.89-1.664l7-4.666a2 2 0 012.22 0l7 4.666A2 2 0 0121 10.07V19M3 19a2 2 0 002 2h14a2 2 0 002-2M3 19l6.75-4.5M21 19l-6.75-4.5M3 10l6.75 4.5M21 10l-6.75 4.5m0 0l-1.14.76a2 2 0 01-2.22 0l-1.14-.76"></path></svg>
                    </div>
                    <h3 class="text-sm font-bold text-slate-700 dark:text-slate-300 font-mono uppercase tracking-wider mb-1">Mailbox Empty</h3>
                    <p class="text-xs text-slate-500 font-mono">No messages found in your agent's private room.</p>
                  </div>
                `;
                return;
            }

            let html = '';
            data.messages.forEach((msg, idx) => {
                let text = "Unknown format";
                let time = "Unknown time";
                let sender = "Anonymous";
                
                if (typeof msg === 'object') {
                    text = msg.text || "";
                    sender = msg.did || sender;
                    if (msg.ts) {
                        time = new Date(msg.ts).toLocaleString();
                    }
                } else if (typeof msg === 'string') {
                    text = msg;
                }

                html += `
                  <div class="group flex items-center justify-between gap-4 px-4 py-3 hover:bg-slate-50 dark:hover:bg-slate-900/40 transition border-b border-slate-100 dark:border-slate-800/50 last:border-0 relative">
                    <div class="flex items-start gap-3 min-w-0 flex-1">
                      <div class="w-8 h-8 rounded-full bg-indigo-100 dark:bg-indigo-900/50 flex items-center justify-center flex-shrink-0 mt-0.5">
                        <svg class="w-4 h-4 text-indigo-600 dark:text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                      </div>
                      <div class="min-w-0 flex-1">
                        <p class="text-xs font-mono text-slate-700 dark:text-slate-300 break-words line-clamp-2">${text}</p>
                        <p class="text-[10px] font-mono text-slate-400 mt-0.5 truncate">From: ${sender}</p>
                      </div>
                    </div>
                    <div class="flex flex-col items-end gap-2 flex-shrink-0">
                      <p class="text-[10px] font-mono text-slate-400 whitespace-nowrap">${time}</p>
                      <button onclick="replyToMessage(this)" data-text="${encodeURIComponent(text)}" class="opacity-0 group-hover:opacity-100 transition-opacity flex items-center gap-1 text-[10px] font-bold font-mono uppercase tracking-wider text-[#00c2ff] hover:text-cyan-600 bg-cyan-50 dark:bg-cyan-950/30 px-2 py-1 rounded-md">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path></svg>
                        Reply
                      </button>
                    </div>
                  </div>
                `;
            });
            container.innerHTML = html;

            // Trigger animations
            if (typeof animateCards === 'function') {
                requestAnimationFrame(() => animateCards());
            }

        } catch (err) {
            container.innerHTML = `<div class="px-5 py-8 text-center"><p class="text-sm font-mono text-rose-500">Failed to load inbox.</p></div>`;
        }
    }

    function replyToMessage(btn) {
        const rawText = decodeURIComponent(btn.getAttribute('data-text'));
        const truncated = rawText.length > 50 ? rawText.substring(0, 50) + '...' : rawText;
        const replyString = `Replying to: "${truncated}"\n\n-> `;
        if (typeof openPostModal === 'function') {
            openPostModal(replyString);
        }
    }

    // Auto-refresh inbox every 30 seconds if page is open
    setInterval(fetchInbox, 30000);

    document.addEventListener('DOMContentLoaded', fetchInbox);
</script>
{% endblock %}
